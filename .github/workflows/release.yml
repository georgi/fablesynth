name: Release

# Build the FableSynth plugins — WT-1 (FableSynth), DR-1 (FableDrum),
# BL-1 (FableBass) and SQ-4 (FableSeq) — (VST3 + Standalone on every OS, AU on
# macOS) for macOS, Windows and Linux and attach the zips to a GitHub release.
#
# Push a tag like `v1.0.0` to cut a release, or run the workflow manually
# (workflow_dispatch) to produce downloadable build artifacts without a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS
            # Universal binary: runs natively on Apple Silicon and Intel.
            cmake_args: "-DCMAKE_OSX_ARCHITECTURES='arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13"
          - os: ubuntu-22.04
            name: Linux
            cmake_args: ""
          - os: windows-2022
            name: Windows
            cmake_args: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libx11-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxcursor-dev libfreetype6-dev libfontconfig1-dev \
            libgl1-mesa-dev

      - name: Configure
        working-directory: juce
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build plugin
        working-directory: juce
        run: cmake --build build --config Release --target FableSynth_All FableDrum_All FableBass_All FableSeq_All --parallel

      # Local macOS builds remain ad-hoc signed by CMake so hardened DAW
      # scanners accept them. Release artifacts need a real Developer ID
      # signature and an Apple notarization ticket to pass Gatekeeper after
      # they have been downloaded on another Mac.
      - name: Sign macOS bundles for distribution
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${MACOS_CERTIFICATE:?Set the MACOS_CERTIFICATE repository secret}"
          : "${MACOS_CERTIFICATE_PASSWORD:?Set the MACOS_CERTIFICATE_PASSWORD repository secret}"

          certificate="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/fablesynth-signing.keychain-db"
          keychain_password="$(uuidgen)"
          trap 'security delete-keychain "$keychain" >/dev/null 2>&1 || true' EXIT

          printf '%s' "$MACOS_CERTIFICATE" | base64 -D > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$keychain_password" "$keychain"

          identity="$(security find-identity -v -p codesigning "$keychain" \
            | awk '/Developer ID Application/ { print $2; exit }')"
          test -n "$identity" || {
            echo "The imported certificate is not a Developer ID Application certificate" >&2
            exit 1
          }

          bundles=(
            "juce/build/FableSynth_artefacts/Release/VST3/FableSynth WT-1.vst3"
            "juce/build/FableSynth_artefacts/Release/AU/FableSynth WT-1.component"
            "juce/build/FableSynth_artefacts/Release/Standalone/FableSynth WT-1.app"
            "juce/build/FableDrum_artefacts/Release/VST3/FableSynth DR-1.vst3"
            "juce/build/FableDrum_artefacts/Release/AU/FableSynth DR-1.component"
            "juce/build/FableDrum_artefacts/Release/Standalone/FableSynth DR-1.app"
            "juce/build/FableBass_artefacts/Release/VST3/FableSynth BL-1.vst3"
            "juce/build/FableBass_artefacts/Release/AU/FableSynth BL-1.component"
            "juce/build/FableBass_artefacts/Release/Standalone/FableSynth BL-1.app"
            "juce/build/FableSeq_artefacts/Release/VST3/FableSynth SQ-4.vst3"
            "juce/build/FableSeq_artefacts/Release/AU/FableSynth SQ-4.component"
            "juce/build/FableSeq_artefacts/Release/Standalone/FableSynth SQ-4.app"
          )

          for bundle in "${bundles[@]}"; do
            codesign --force --options runtime --timestamp \
              --keychain "$keychain" --sign "$identity" "$bundle"
            codesign --verify --deep --strict --verbose=2 "$bundle"
          done

      # ---- Package (one zip per platform: VST3 + Standalone, plus AU on macOS) ----

      - name: Package (macOS)
        if: runner.os == 'macOS'
        working-directory: juce/build/FableSynth_artefacts/Release
        run: |
          stage="FableSynth-macOS"
          mkdir -p "$stage"
          ditto "VST3/FableSynth WT-1.vst3"      "$stage/FableSynth WT-1.vst3"
          ditto "AU/FableSynth WT-1.component"   "$stage/FableSynth WT-1.component"
          ditto "Standalone/FableSynth WT-1.app" "$stage/FableSynth WT-1.app"
          ditto -c -k --keepParent "$stage" "$GITHUB_WORKSPACE/FableSynth-macOS.zip"

      - name: Package DR-1 (macOS)
        if: runner.os == 'macOS'
        working-directory: juce/build/FableDrum_artefacts/Release
        run: |
          stage="FableSynth-DR1-macOS"
          mkdir -p "$stage"
          ditto "VST3/FableSynth DR-1.vst3"      "$stage/FableSynth DR-1.vst3"
          ditto "AU/FableSynth DR-1.component"   "$stage/FableSynth DR-1.component"
          ditto "Standalone/FableSynth DR-1.app" "$stage/FableSynth DR-1.app"
          ditto -c -k --keepParent "$stage" "$GITHUB_WORKSPACE/FableSynth-DR1-macOS.zip"

      - name: Package BL-1 (macOS)
        if: runner.os == 'macOS'
        working-directory: juce/build/FableBass_artefacts/Release
        run: |
          stage="FableSynth-BL1-macOS"
          mkdir -p "$stage"
          ditto "VST3/FableSynth BL-1.vst3"      "$stage/FableSynth BL-1.vst3"
          ditto "AU/FableSynth BL-1.component"   "$stage/FableSynth BL-1.component"
          ditto "Standalone/FableSynth BL-1.app" "$stage/FableSynth BL-1.app"
          ditto -c -k --keepParent "$stage" "$GITHUB_WORKSPACE/FableSynth-BL1-macOS.zip"

      - name: Package SQ-4 (macOS)
        if: runner.os == 'macOS'
        working-directory: juce/build/FableSeq_artefacts/Release
        run: |
          stage="FableSynth-SQ4-macOS"
          mkdir -p "$stage"
          ditto "VST3/FableSynth SQ-4.vst3"      "$stage/FableSynth SQ-4.vst3"
          ditto "AU/FableSynth SQ-4.component"   "$stage/FableSynth SQ-4.component"
          ditto "Standalone/FableSynth SQ-4.app" "$stage/FableSynth SQ-4.app"
          ditto -c -k --keepParent "$stage" "$GITHUB_WORKSPACE/FableSynth-SQ4-macOS.zip"

      - name: Notarize and staple macOS bundles
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          : "${APPLE_API_KEY:?Set the APPLE_API_KEY repository secret}"
          : "${APPLE_API_KEY_ID:?Set the APPLE_API_KEY_ID repository secret}"
          : "${APPLE_API_ISSUER_ID:?Set the APPLE_API_ISSUER_ID repository secret}"

          api_key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY" > "$api_key"

          archives=(
            "$GITHUB_WORKSPACE/FableSynth-macOS.zip"
            "$GITHUB_WORKSPACE/FableSynth-DR1-macOS.zip"
            "$GITHUB_WORKSPACE/FableSynth-BL1-macOS.zip"
            "$GITHUB_WORKSPACE/FableSynth-SQ4-macOS.zip"
          )
          for archive in "${archives[@]}"; do
            xcrun notarytool submit "$archive" --wait \
              --key "$api_key" --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID"
          done

          stages=(
            "juce/build/FableSynth_artefacts/Release/FableSynth-macOS"
            "juce/build/FableDrum_artefacts/Release/FableSynth-DR1-macOS"
            "juce/build/FableBass_artefacts/Release/FableSynth-BL1-macOS"
            "juce/build/FableSeq_artefacts/Release/FableSynth-SQ4-macOS"
          )
          for stage in "${stages[@]}"; do
            for bundle in "$stage"/*.vst3 "$stage"/*.component "$stage"/*.app; do
              xcrun stapler staple "$bundle"
              xcrun stapler validate "$bundle"
              codesign --verify --deep --strict --verbose=2 "$bundle"
            done
          done

          # ZIP files cannot themselves carry a stapled ticket. Recreate each
          # distributed archive from the now-stapled bundles so Gatekeeper can
          # validate them even when the destination Mac is offline.
          for i in "${!archives[@]}"; do
            rm -f "${archives[$i]}"
            ditto -c -k --keepParent "${stages[$i]}" "${archives[$i]}"
          done

      - name: Package (Linux)
        if: runner.os == 'Linux'
        working-directory: juce/build/FableSynth_artefacts/Release
        run: |
          stage="FableSynth-Linux"
          mkdir -p "$stage"
          cp -R "VST3/FableSynth WT-1.vst3" "$stage/"
          cp "Standalone/FableSynth WT-1"   "$stage/"
          zip -r "$GITHUB_WORKSPACE/FableSynth-Linux.zip" "$stage"

      - name: Package DR-1 (Linux)
        if: runner.os == 'Linux'
        working-directory: juce/build/FableDrum_artefacts/Release
        run: |
          stage="FableSynth-DR1-Linux"
          mkdir -p "$stage"
          cp -R "VST3/FableSynth DR-1.vst3" "$stage/"
          cp "Standalone/FableSynth DR-1"   "$stage/"
          zip -r "$GITHUB_WORKSPACE/FableSynth-DR1-Linux.zip" "$stage"

      - name: Package BL-1 (Linux)
        if: runner.os == 'Linux'
        working-directory: juce/build/FableBass_artefacts/Release
        run: |
          stage="FableSynth-BL1-Linux"
          mkdir -p "$stage"
          cp -R "VST3/FableSynth BL-1.vst3" "$stage/"
          cp "Standalone/FableSynth BL-1"   "$stage/"
          zip -r "$GITHUB_WORKSPACE/FableSynth-BL1-Linux.zip" "$stage"

      - name: Package SQ-4 (Linux)
        if: runner.os == 'Linux'
        working-directory: juce/build/FableSeq_artefacts/Release
        run: |
          stage="FableSynth-SQ4-Linux"
          mkdir -p "$stage"
          cp -R "VST3/FableSynth SQ-4.vst3" "$stage/"
          cp "Standalone/FableSynth SQ-4"   "$stage/"
          zip -r "$GITHUB_WORKSPACE/FableSynth-SQ4-Linux.zip" "$stage"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: juce/build/FableSynth_artefacts/Release
        run: |
          $stage = "FableSynth-Windows"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse "VST3/FableSynth WT-1.vst3" $stage/
          Copy-Item "Standalone/FableSynth WT-1.exe"     $stage/
          Compress-Archive -Path $stage -DestinationPath "$env:GITHUB_WORKSPACE/FableSynth-Windows.zip" -Force

      - name: Package DR-1 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: juce/build/FableDrum_artefacts/Release
        run: |
          $stage = "FableSynth-DR1-Windows"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse "VST3/FableSynth DR-1.vst3" $stage/
          Copy-Item "Standalone/FableSynth DR-1.exe"     $stage/
          Compress-Archive -Path $stage -DestinationPath "$env:GITHUB_WORKSPACE/FableSynth-DR1-Windows.zip" -Force

      - name: Package BL-1 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: juce/build/FableBass_artefacts/Release
        run: |
          $stage = "FableSynth-BL1-Windows"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse "VST3/FableSynth BL-1.vst3" $stage/
          Copy-Item "Standalone/FableSynth BL-1.exe"     $stage/
          Compress-Archive -Path $stage -DestinationPath "$env:GITHUB_WORKSPACE/FableSynth-BL1-Windows.zip" -Force

      - name: Package SQ-4 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: juce/build/FableSeq_artefacts/Release
        run: |
          $stage = "FableSynth-SQ4-Windows"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse "VST3/FableSynth SQ-4.vst3" $stage/
          Copy-Item "Standalone/FableSynth SQ-4.exe"     $stage/
          Compress-Archive -Path $stage -DestinationPath "$env:GITHUB_WORKSPACE/FableSynth-SQ4-Windows.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FableSynth-${{ matrix.name }}
          path: FableSynth-*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## FableSynth — ${{ github.ref_name }}

            Four plugins (VST3 · AU · Standalone):
            - **WT-1** — wavetable synthesizer (`FableSynth-<platform>.zip`)
            - **DR-1** — 16-pad wavetable drum machine with 5-bus multi-out (`FableSynth-DR1-<platform>.zip`)
            - **BL-1** — acid bassline synth with 16-step pitch sequencer (`FableSynth-BL1-<platform>.zip`)
            - **SQ-4** — session clip launcher hosting the WT-1/DR-1/BL-1 engines (`FableSynth-SQ4-<platform>.zip`)

            **Download the zip(s) for your platform below, then install:**

            | Platform | VST3 | AU | Standalone |
            | --- | --- | --- | --- |
            | macOS | `~/Library/Audio/Plug-Ins/VST3/` | `~/Library/Audio/Plug-Ins/Components/` | drag the `.app` to Applications |
            | Windows | `C:\Program Files\Common Files\VST3\` | — | run the `.exe` |
            | Linux | `~/.vst3/` | — | run the binary |

            macOS builds are **universal** (Apple Silicon + Intel), signed with
            a Developer ID certificate, and notarized by Apple.
